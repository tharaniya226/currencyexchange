    <style>
        /* Currency Note Animation - Premium Forex Style */
        .currency-note-container {
            perspective: 2500px;
            margin-bottom: 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            position: relative;
        }

        .currency-note {
            position: relative;
            width: 450px;
            height: 220px;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: floatNote 3s ease-in-out infinite;
        }

        /* Floating animation */
        @keyframes floatNote {
            0%, 100% {
                transform: translateY(0px) rotateX(2deg);
            }
            50% {
                transform: translateY(-10px) rotateX(-2deg);
            }
        }

        /* Realistic note image */
        .note-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.6),
                0 10px 20px rgba(0, 0, 0, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
            backface-visibility: visible;
        }

        /* Currency change animation - fade and slide */
        .currency-note.changing .note-image {
            animation: currencyChange 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes currencyChange {
            0% {
                opacity: 1;
                transform: translateX(0) scale(1) rotateY(0deg);
            }
            50% {
                opacity: 0;
                transform: translateX(-50px) scale(0.9) rotateY(-90deg);
            }
            51% {
                opacity: 0;
                transform: translateX(50px) scale(0.9) rotateY(90deg);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1) rotateY(0deg);
            }
        }

        /* Swap flip animation - horizontal flip like real cash */
        .currency-note.flipping {
            animation: realMoneyFlip 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes realMoneyFlip {
            0% {
                transform: translateY(0) translateZ(0) rotateY(0deg) rotateX(0deg) scale(1);
            }
            15% {
                transform: translateY(-35px) translateZ(20px) rotateY(0deg) rotateX(-5deg) scale(1.02);
            }
            25% {
                transform: translateY(-50px) translateZ(40px) rotateY(45deg) rotateX(-8deg) scale(1.05);
            }
            40% {
                transform: translateY(-60px) translateZ(50px) rotateY(90deg) rotateX(-10deg) scale(1.08);
            }
            50% {
                transform: translateY(-65px) translateZ(55px) rotateY(135deg) rotateX(-10deg) scale(1.08);
            }
            60% {
                transform: translateY(-60px) translateZ(50px) rotateY(180deg) rotateX(-8deg) scale(1.05);
            }
            75% {
                transform: translateY(-40px) translateZ(30px) rotateY(180deg) rotateX(-5deg) scale(1.02);
            }
            85% {
                transform: translateY(-10px) translateZ(10px) rotateY(180deg) rotateX(-2deg) scale(1);
            }
            92% {
                transform: translateY(5px) translateZ(0) rotateY(180deg) rotateX(2deg) scale(0.98);
            }
            100% {
                transform: translateY(0) translateZ(0) rotateY(180deg) rotateX(0deg) scale(1);
            }
        }

        /* Country-based glow effects */
        .currency-note.glow-usd::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(133, 187, 101, 0.3) 0%, transparent 70%);
            opacity: 0;
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        .currency-note.glow-eur::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.3) 0%, transparent 70%);
            opacity: 0;
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        .currency-note.glow-gbp::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(155, 89, 182, 0.3) 0%, transparent 70%);
            opacity: 0;
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        .currency-note.glow-jpy::after,
        .currency-note.glow-cny::after,
        .currency-note.glow-cad::after,
        .currency-note.glow-chf::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(231, 76, 60, 0.3) 0%, transparent 70%);
            opacity: 0;
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        .currency-note.glow-aud::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.3) 0%, transparent 70%);
            opacity: 0;
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        .currency-note.glow-inr::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(255, 153, 51, 0.3) 0%, transparent 70%);
            opacity: 0;
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
        }

        /* Dynamic shadow during flip */
        .currency-note::before {
            content: '';
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.5) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.6;
            transition: all 0.3s ease;
            z-index: -1;
        }

        .currency-note.flipping::before {
            animation: shadowFlip 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes shadowFlip {
            0%, 100% {
                width: 80%;
                opacity: 0.6;
                filter: blur(15px);
            }
            50% {
                width: 40%;
                opacity: 0.3;
                filter: blur(25px);
            }
        }

        /* Motion blur effect during flip */
        .currency-note.flipping .note-image {
            animation: motionBlur 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes motionBlur {
            0%, 100% {
                filter: blur(0px) brightness(1);
            }
            25%, 75% {
                filter: blur(1.5px) brightness(1.1);
            }
            50% {
                filter: blur(3px) brightness(1.2);
            }
        }

        /* Glow effect during flip */
        .currency-note.flipping::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.5) 0%, rgba(118, 75, 162, 0.3) 40%, transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: glowPulse 1.4s ease-out;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        @keyframes glowPulse {
            0%, 100% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            50% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        /* Hover effect */
        .currency-note:not(.flipping):hover {
            transform: translateY(-8px) rotateX(5deg);
        }

        .currency-note:not(.flipping):hover .note-image {
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.7),
                0 15px 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .currency-note {
                width: 340px;
                height: 170px;
            }
        }

        @media (max-width: 480px) {
            .currency-note {
                width: 300px;
                height: 150px;
            }
        }
    </style>

    <style>
        /* Converter Scene & 3D Setup */
        .converter-scene {
            perspective: 1500px;
            margin: 0 auto;
        }

        .converter-card {
            position: relative;
            width: 100%;
            height: 600px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .converter-card.flipped {
            transform: rotateY(180deg);
        }

        .converter-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .converter-front {
            transform: rotateY(0deg);
        }

        .converter-back {
            transform: rotateY(180deg);
            background: rgba(102, 126, 234, 0.1);
        }

        /* Dynamic Currency Watermark */
        .currency-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 0;
            transition: all 0.5s ease;
        }

        /* Currency Section */
        .currency-section {
            position: relative;
            z-index: 1;
            margin-bottom: 2rem;
        }

        .currency-label {
            display: block;
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .currency-input-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s ease;
        }

        .currency-input-group:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: rgba(255, 255, 255, 0.12);
        }

        .currency-flag {
            font-size: 2.5rem;
            flex-shrink: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .currency-flag.swapping {
            animation: flagSwap 0.6s ease;
        }

        @keyframes flagSwap {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(0.5) rotate(180deg); opacity: 0.3; }
        }

        .currency-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 2rem;
            font-weight: 700;
            outline: none;

        .currency-input::placeholder {

            padding: 0.75rem 1rem;

            transition: all 0.3s ease;

            border-color: rgba(102, 126, 234, 0.6);
        }

        .currency-select option {
            background: #1e293b;
            color: white;
        }

        /* Swap Button */
        .swap-button-container {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
            position: relative;
            z-index: 2;
        }

        .swap-button {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 4px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .swap-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .swap-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.6);
        }

        .swap-button:active::before {
            width: 300px;
            height: 300px;
        }

        .swap-button.rotating {
            animation: rotate360 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes rotate360 {
            from { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            to { transform: rotate(360deg) scale(1); }
        }

        .swap-button.glowing {
            animation: glow 0.6s ease;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 0 60px rgba(102, 126, 234, 1), 0 0 100px rgba(102, 126, 234, 0.6); }
        }

        /* Exchange Rate Info */
        .exchange-rate-info {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.25rem;
            margin-top: 2rem;
        }

        /* Quick Convert Buttons */
        .quick-convert-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-convert-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-4px);
        }

        /* Value Animation */
        .value-animating {
            animation: valueChange 0.6s ease;
        }

        @keyframes valueChange {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Particle Effect */
        .particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: particleBurst 0.8s ease-out forwards;
        }

        @keyframes particleBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
