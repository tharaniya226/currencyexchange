<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Notes</title>
    <style>
        body {
            background: #1a1f3a;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .note {
            width: 400px;
            height: 200px;
            margin: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .note-content {
            text-align: center;
            z-index: 2;
        }
        .note-symbol {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .note-value {
            font-size: 36px;
            font-weight: bold;
        }
        .note-name {
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.8;
        }
        .note-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, currentColor 10px, currentColor 20px);
        }
        
        /* USD - Green */
        .usd {
            background: linear-gradient(135deg, #1e7b34 0%, #2d9f4a 100%);
            color: white;
        }
        
        /* EUR - Blue */
        .eur {
            background: linear-gradient(135deg, #003399 0%, #0055cc 100%);
            color: white;
        }
        
        /* GBP - Purple */
        .gbp {
            background: linear-gradient(135deg, #6b1f7b 0%, #8b2f9b 100%);
            color: white;
        }
        
        /* JPY - Red */
        .jpy {
            background: linear-gradient(135deg, #cc0000 0%, #ff3333 100%);
            color: white;
        }
        
        /* INR - Orange */
        .inr {
            background: linear-gradient(135deg, #ff9933 0%, #ffb366 100%);
            color: white;
        }
        
        /* CHF - Red/White */
        .chf {
            background: linear-gradient(135deg, #ff0000 0%, #ff4444 100%);
            color: white;
        }
        
        /* CAD - Red */
        .cad {
            background: linear-gradient(135deg, #ff0000 0%, #ff3333 100%);
            color: white;
        }
        
        /* AUD - Blue/Green */
        .aud {
            background: linear-gradient(135deg, #0033cc 0%, #0055ff 100%);
            color: white;
        }
        
        /* CNY - Red/Gold */
        .cny {
            background: linear-gradient(135deg, #de2910 0%, #ff4433 100%);
            color: #ffd700;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">Currency Notes - Right-click and "Save Image As"</h1>
    
    <div class="note usd" id="usd">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">$</div>
            <div class="note-value">100</div>
            <div class="note-name">UNITED STATES DOLLAR</div>
        </div>
    </div>
    
    <div class="note eur" id="eur">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">€</div>
            <div class="note-value">100</div>
            <div class="note-name">EURO</div>
        </div>
    </div>
    
    <div class="note gbp" id="gbp">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">£</div>
            <div class="note-value">100</div>
            <div class="note-name">BRITISH POUND</div>
        </div>
    </div>
    
    <div class="note jpy" id="jpy">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">¥</div>
            <div class="note-value">10000</div>
            <div class="note-name">JAPANESE YEN</div>
        </div>
    </div>
    
    <div class="note inr" id="inr">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">₹</div>
            <div class="note-value">500</div>
            <div class="note-name">INDIAN RUPEE</div>
        </div>
    </div>
    
    <div class="note chf" id="chf">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">Fr</div>
            <div class="note-value">100</div>
            <div class="note-name">SWISS FRANC</div>
        </div>
    </div>
    
    <div class="note cad" id="cad">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">C$</div>
            <div class="note-value">100</div>
            <div class="note-name">CANADIAN DOLLAR</div>
        </div>
    </div>
    
    <div class="note aud" id="aud">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">A$</div>
            <div class="note-value">100</div>
            <div class="note-name">AUSTRALIAN DOLLAR</div>
        </div>
    </div>
    
    <div class="note cny" id="cny">
        <div class="note-pattern"></div>
        <div class="note-content">
            <div class="note-symbol">¥</div>
            <div class="note-value">100</div>
            <div class="note-name">CHINESE YUAN</div>
        </div>
    </div>
</body>
</html>
