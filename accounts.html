<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - ForexCast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%); min-height: 100vh;">
    
    <script src="assets/js/auth.js"></script>
    <script>requireAuth();</script>

    <div style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
        <div style="margin-bottom: 2rem;">
            <button onclick="window.location.href='index.html'" style="background: rgba(102, 126, 234, 0.2); border: 1px solid rgba(102, 126, 234, 0.3); color: white; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;">
                <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
            </button>
        </div>

        <h1 style="color: white; font-size: 2.5rem; font-weight: bold; margin-bottom: 2rem;">My Accounts</h1>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem;">
            <!-- Profile Card -->
            <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 2rem;">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-user" style="font-size: 3rem; color: white;"></i>
                    </div>
                    <h2 style="color: white; font-size: 1.5rem; font-weight: 600;">Lusiana</h2>
                    <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem;">lusiana@forexcast.com</p>
                </div>
                <div style="border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                        <span style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem;">Member Since</span>
                        <span style="color: white; font-size: 0.875rem;">Jan 2024</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                        <span style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem;">Account Type</span>
                        <span style="color: #667eea; font-weight: 600; font-size: 0.875rem;">Premium</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem;">Status</span>
                        <span style="color: #10b981; font-size: 0.875rem;">Active</span>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div style="display: grid; gap: 1.5rem;">
                <!-- Personal Information -->
                <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 1.5rem;">
                    <h3 style="color: white; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Personal Information</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem; display: block; margin-bottom: 0.5rem;">Full Name</label>
                            <input type="text" value="Lusiana" style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white;">
                        </div>
                        <div>
                            <label style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem; display: block; margin-bottom: 0.5rem;">Email</label>
                            <input type="email" value="lusiana@forexcast.com" style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white;">
                        </div>
                        <div>
                            <label style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem; display: block; margin-bottom: 0.5rem;">Phone</label>
                            <input type="tel" value="+1 234 567 8900" style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white;">
                        </div>
                        <div>
                            <label style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem; display: block; margin-bottom: 0.5rem;">Country</label>
                            <input type="text" value="United States" style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white;">
                        </div>
                    </div>
                    <button onclick="updateAccountInfo()" style="width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: all 0.3s;">
                        Update Information
                    </button>
                </div>

                <!-- Connected Accounts -->
                <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 1.5rem;">
                    <h3 style="color: white; font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Connected Accounts</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div style="padding: 1rem; background: rgba(255, 255, 255, 0.03); border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <i class="fab fa-google" style="font-size: 1.5rem; color: #ea4335;"></i>
                                <div>
                                    <div style="color: white; font-weight: 500; font-size: 0.875rem;">Google</div>
                                    <div style="color: rgba(255, 255, 255, 0.6); font-size: 0.75rem;">Connected</div>
                                </div>
                            </div>
                            <button style="padding: 0.25rem 0.75rem; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; color: #ef4444; cursor: pointer; font-size: 0.75rem;">Disconnect</button>
                        </div>
                        <div style="padding: 1rem; background: rgba(255, 255, 255, 0.03); border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <i class="fab fa-facebook" style="font-size: 1.5rem; color: #1877f2;"></i>
                                <div>
                                    <div style="color: white; font-weight: 500; font-size: 0.875rem;">Facebook</div>
                                    <div style="color: rgba(255, 255, 255, 0.6); font-size: 0.75rem;">Not connected</div>
                                </div>
                            </div>
                            <button style="padding: 0.25rem 0.75rem; background: rgba(102, 126, 234, 0.2); border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 8px; color: #667eea; cursor: pointer; font-size: 0.75rem;">Connect</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/chatbot.js"></script>
    
    <script>
        // Update Account Information
        function updateAccountInfo() {
            const fullName = document.querySelectorAll('input[type="text"]')[0].value;
            const email = document.querySelector('input[type="email"]').value;
            const phone = document.querySelector('input[type="tel"]').value;
            const country = document.querySelectorAll('input[type="text"]')[1].value;
            
            // Validate inputs
            if (!fullName || !email || !phone || !country) {
                alert('Please fill in all fields');
                return;
            }
            
            // Save to localStorage
            const accountInfo = {
                fullName,
                email,
                phone,
                country,
                updatedAt: new Date().toISOString()
            };
            
            localStorage.setItem('forexcast_account', JSON.stringify(accountInfo));
            
            // Show success message
            const button = event.target;
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-check" style="margin-right: 0.5rem;"></i>Information Updated!';
            button.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            
            setTimeout(() => {
                button.innerHTML = originalText;
                button.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
            }, 2000);
        }
        
        // Load saved account info on page load
        window.addEventListener('load', function() {
            const savedAccount = localStorage.getItem('forexcast_account');
            if (savedAccount) {
                const account = JSON.parse(savedAccount);
                
                document.querySelectorAll('input[type="text"]')[0].value = account.fullName || 'Lusiana';
                document.querySelector('input[type="email"]').value = account.email || 'lusiana@forexcast.com';
                document.querySelector('input[type="tel"]').value = account.phone || '+1 234 567 8900';
                document.querySelectorAll('input[type="text"]')[1].value = account.country || 'United States';
            }
        });
        
        // Connect/Disconnect Social Accounts
        document.querySelectorAll('button').forEach(btn => {
            if (btn.textContent.includes('Disconnect')) {
                btn.addEventListener('click', function() {
                    if (confirm('Are you sure you want to disconnect this account?')) {
                        this.textContent = 'Connect';
                        this.style.background = 'rgba(102, 126, 234, 0.2)';
                        this.style.borderColor = 'rgba(102, 126, 234, 0.3)';
                        this.style.color = '#667eea';
                        
                        // Update parent div text
                        this.parentElement.querySelector('div:last-of-type').textContent = 'Not connected';
                    }
                });
            } else if (btn.textContent.includes('Connect') && !btn.textContent.includes('Connected')) {
                btn.addEventListener('click', function() {
                    this.textContent = 'Disconnect';
                    this.style.background = 'rgba(239, 68, 68, 0.2)';
                    this.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                    this.style.color = '#ef4444';
                    
                    // Update parent div text
                    this.parentElement.querySelector('div:last-of-type').textContent = 'Connected';
                    
                    alert('Account connected successfully!');
                });
            }
        });
    </script>
</body>
</html>
