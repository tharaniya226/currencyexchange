<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex News Dashboard - ForexCast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/chatbot.css">
</head>
<body class="bg-gradient-dark">
    <div class="animated-bg"></div>

    <!-- Navbar -->
    <nav class="navbar glass-card">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fas fa-chart-line text-3xl text-accent-blue"></i>
                <h1 class="text-xl font-bold text-white">ForexCast</h1>
            </div>
            <div class="hidden md:flex items-center space-x-6">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="forecast.html" class="nav-link">Forecast</a>
                <a href="converter.html" class="nav-link">Converter</a>
                <a href="news.html" class="nav-link active">News</a>
                <a href="geo-alerts.html" class="nav-link">Geo Alerts</a>
                <a href="alerts.html" class="nav-link">Alerts</a>
            </div>
            <button class="hamburger md:hidden" id="hamburger">
                <i class="fas fa-bars text-white text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html" class="mobile-link">Dashboard</a>
        <a href="forecast.html" class="mobile-link">Forecast</a>
        <a href="converter.html" class="mobile-link">Converter</a>
        <a href="news.html" class="mobile-link active">News</a>
        <a href="geo-alerts.html" class="mobile-link">Geo Alerts</a>
        <a href="alerts.html" class="mobile-link">Alerts</a>
    </div>

    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">Forex News Dashboard</h1>
                <p class="text-gray-400">Real-time market news with impact analysis</p>
            </div>
            <div class="flex items-center space-x-3 mt-4 md:mt-0">
                <div class="glass-card px-4 py-2">
                    <span class="text-sm text-gray-400">Total News:</span>
                    <span class="text-xl font-bold text-accent-blue ml-2" id="totalNewsCount">0</span>
                </div>
                <button id="refreshNews" class="px-4 py-2 bg-accent-blue hover:bg-blue-600 text-white rounded-lg transition-all">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="glass-card p-4 mb-6">
            <div class="flex flex-wrap gap-3">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-globe mr-2"></i>All News
                </button>
                <button class="filter-btn" data-filter="bullish">
                    <i class="fas fa-arrow-up mr-2"></i>Bullish
                </button>
                <button class="filter-btn" data-filter="bearish">
                    <i class="fas fa-arrow-down mr-2"></i>Bearish
                </button>
                <button class="filter-btn" data-filter="neutral">
                    <i class="fas fa-minus mr-2"></i>Neutral
                </button>
            </div>
        </div>

        <!-- News Grid -->
        <div id="newsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- News cards will be dynamically inserted here -->
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-12 hidden">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-accent-blue"></div>
            <p class="text-gray-400 mt-4">Loading news...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12 hidden">
            <i class="fas fa-newspaper text-6xl text-gray-600 mb-4"></i>
            <p class="text-gray-400 text-lg">No news available</p>
        </div>
    </div>

    <style>
        .forex-news-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .forex-news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .forex-news-card:hover::before {
            transform: scaleX(1);
        }

        .forex-news-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .country-flag {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .impact-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .impact-bullish {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .impact-bearish {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .impact-neutral {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.4);
        }

        .filter-btn {
            padding: 0.625rem 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(102, 126, 234, 0.5);
            color: white;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .news-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: white;
            margin-bottom: 0.75rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-summary {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .click-hint {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            color: #a78bfa;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forex-news-card:hover .click-hint {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateX(4px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .forex-news-card {
            animation: slideUp 0.5s ease forwards;
        }
    </style>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/chatbot.js"></script>
    <script src="assets/js/news-dashboard.js"></script>
</body>
</html>
