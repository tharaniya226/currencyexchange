<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ForexCast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gradient-dark">
    <div class="animated-bg"></div>

    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            <!-- Logo and Title -->
            <div class="text-center mb-8">
                <div class="flex items-center justify-center space-x-3 mb-4">
                    <i class="fas fa-chart-line text-5xl text-accent-blue"></i>
                </div>
                <h1 class="text-4xl font-bold text-white mb-2">ForexCast</h1>
                <p class="text-gray-400">Real-Time Currency Exchange Forecasting</p>
            </div>

            <!-- Login Card -->
            <div class="glass-card p-8">
                <h2 class="text-2xl font-bold text-white mb-6 text-center">Welcome Back</h2>
                
                <form id="loginForm" class="space-y-6">
                    <!-- Email Input -->
                    <div>
                        <label class="block text-gray-400 mb-2 text-sm font-medium">
                            <i class="fas fa-envelope mr-2"></i>Email Address
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            class="input-field" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label class="block text-gray-400 mb-2 text-sm font-medium">
                            <i class="fas fa-lock mr-2"></i>Password
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                class="input-field pr-12" 
                                placeholder="Enter your password"
                                required
                            >
                            <button 
                                type="button" 
                                id="togglePassword" 
                                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input 
                                type="checkbox" 
                                id="remember" 
                                class="w-4 h-4 rounded border-gray-600 bg-gray-700 text-accent-blue focus:ring-2 focus:ring-accent-blue"
                            >
                            <span class="text-sm text-gray-400">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-accent-blue hover:text-blue-400 transition-colors">
                            Forgot Password?
                        </a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn-primary w-full">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-gray-900 bg-opacity-50 text-gray-400">Or continue with</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-4">
                    <button class="social-btn">
                        <i class="fab fa-google mr-2"></i>
                        Google
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-github mr-2"></i>
                        GitHub
                    </button>
                </div>

                <!-- Sign Up Link -->
                <p class="text-center text-gray-400 text-sm mt-6">
                    Don't have an account? 
                    <a href="#" class="text-accent-blue hover:text-blue-400 font-semibold transition-colors">
                        Sign Up
                    </a>
                </p>
            </div>

            <!-- Features -->
            <div class="grid grid-cols-3 gap-4 mt-8">
                <div class="text-center">
                    <i class="fas fa-shield-alt text-2xl text-accent-green mb-2"></i>
                    <p class="text-xs text-gray-400">Secure</p>
                </div>
                <div class="text-center">
                    <i class="fas fa-brain text-2xl text-accent-blue mb-2"></i>
                    <p class="text-xs text-gray-400">AI Powered</p>
                </div>
                <div class="text-center">
                    <i class="fas fa-chart-line text-2xl text-purple-400 mb-2"></i>
                    <p class="text-xs text-gray-400">Real-Time</p>
                </div>
            </div>
        </div>
    </div>

    <style>
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Success message animation */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message {
            animation: slideDown 0.3s ease;
        }
    </style>

    <script src="assets/js/auth.js"></script>
    <script>
        // Redirect if already logged in
        redirectIfLoggedIn();

        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // Handle form submission
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // Basic validation
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            // Show loading state
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';
            submitBtn.disabled = true;

            // Simulate login (replace with actual API call)
            setTimeout(() => {
                // Store login state
                if (remember) {
                    localStorage.setItem('forexcast_user', email);
                } else {
                    sessionStorage.setItem('forexcast_user', email);
                }

                // Show success message
                const successDiv = document.createElement('div');
                successDiv.className = 'success-message fixed top-4 right-4 bg-green-500 bg-opacity-20 border border-green-500 text-white px-6 py-4 rounded-lg shadow-lg z-50';
                successDiv.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-check-circle text-2xl text-green-400"></i>
                        <div>
                            <h3 class="font-semibold">Login Successful!</h3>
                            <p class="text-sm text-gray-300">Welcome to ForexCast!</p>
                        </div>
                    </div>
                `;
                document.body.appendChild(successDiv);

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }, 1500);
        });

        // Show error message
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'fixed top-4 right-4 bg-red-500 bg-opacity-20 border border-red-500 text-white px-6 py-4 rounded-lg shadow-lg z-50';
            errorDiv.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas fa-exclamation-circle text-2xl text-red-400"></i>
                    <div>
                        <h3 class="font-semibold">Error</h3>
                        <p class="text-sm text-gray-300">${message}</p>
                    </div>
                </div>
            `;
            document.body.appendChild(errorDiv);

            setTimeout(() => {
                errorDiv.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => errorDiv.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
